description: >-
  Majesco publishes no API-level changelog, release-notes feed or version history on any public
  surface — there is no public developer portal to carry one. What it DOES publish, on a firm and
  long-running cadence, is a named twice-yearly PLATFORM release announced through its own press
  room and blog. That is the only dated release record a member of the public can read, so it is
  what this artifact captures. It describes the product, not the wire contract: no endpoint,
  schema or breaking-change detail is published with any of these releases.
