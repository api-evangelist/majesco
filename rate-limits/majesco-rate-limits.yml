description: >-
  Majesco publishes no rate limits. There is no public developer portal, no API reference and no
  published throttling policy on any majesco.com surface, so there is no documented limit, no
  documented burst allowance, no documented response header and no documented status code on
  exhaustion. Majesco's API Management gateway runs inside each carrier's own tenant, where limits
  are a deployment and contract matter rather than a published one. This file records that measured
  zero; it replaces a 2026-05-04 bulk-sweep scaffold whose 10/100/1000 rpm tiers and X-RateLimit-*
  header set were invented, not harvested.
