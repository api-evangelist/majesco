naftiko: 1.0.0-alpha2
info:
  label: Majesco Insurance Policy Administration API — Distribution
  description: 'Majesco Insurance Policy Administration API — Distribution. 1 operations. Lead operation: Generate an insurance
    quote. Self-contained Naftiko capability covering one Majesco business surface.'
  tags:
  - Majesco
  - Distribution
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MAJESCO_API_KEY: MAJESCO_API_KEY
capability:
  consumes:
  - type: http
    namespace: policy-distribution
    baseUri: https://api.majesco.example.com/v1
    description: Majesco Insurance Policy Administration API — Distribution business capability. Self-contained, no shared
      references.
    resources:
    - name: quotes
      path: /quotes
      operations:
      - name: createquote
        method: POST
        description: Generate an insurance quote
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MAJESCO_API_KEY}}'
  exposes:
  - type: rest
    namespace: policy-distribution-rest
    port: 8080
    description: REST adapter for Majesco Insurance Policy Administration API — Distribution. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/quotes
      name: quotes
      description: REST surface for quotes.
      operations:
      - method: POST
        name: createquote
        description: Generate an insurance quote
        call: policy-distribution.createquote
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: policy-distribution-mcp
    port: 9090
    transport: http
    description: MCP adapter for Majesco Insurance Policy Administration API — Distribution. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: generate-insurance-quote
      description: Generate an insurance quote
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: policy-distribution.createquote
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
