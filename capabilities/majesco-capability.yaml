naftiko: 1.0.0-alpha2
info:
  label: Majesco Insurance Policy Administration API
  description: Majesco cloud-based insurance platform API for policy administration, claims management, billing, and distribution.
    Supports P&C, L&A, and specialty lines with REST interfaces for digital insurance operations.
  tags:
  - Majesco
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: majesco
    baseUri: https://api.majesco.example.com/v1
    description: Majesco Insurance Policy Administration API HTTP API.
    authentication:
      type: bearer
      token: '{{MAJESCO_TOKEN}}'
    resources:
    - name: policies
      path: /policies
      operations:
      - name: listpolicies
        method: GET
        description: List policies
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by policy status
        - name: productType
          in: query
          type: string
          description: Filter by insurance product type
        - name: policyholderName
          in: query
          type: string
        - name: effectiveDateFrom
          in: query
          type: string
        - name: effectiveDateTo
          in: query
          type: string
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createpolicy
        method: POST
        description: Create a new policy
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: policies-policynumber
      path: /policies/{policyNumber}
      operations:
      - name: getpolicy
        method: GET
        description: Get a policy by policy number
        inputParameters:
        - name: policyNumber
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatepolicy
        method: PATCH
        description: Update (endorse) a policy
        inputParameters:
        - name: policyNumber
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: policies-policynumber-cancel
      path: /policies/{policyNumber}/cancel
      operations:
      - name: cancelpolicy
        method: POST
        description: Cancel a policy
        inputParameters:
        - name: policyNumber
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: policies-policynumber-renew
      path: /policies/{policyNumber}/renew
      operations:
      - name: renewpolicy
        method: POST
        description: Renew a policy
        inputParameters:
        - name: policyNumber
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: claims
      path: /claims
      operations:
      - name: listclaims
        method: GET
        description: List claims
        inputParameters:
        - name: status
          in: query
          type: string
        - name: policyNumber
          in: query
          type: string
        - name: claimDateFrom
          in: query
          type: string
        - name: pageSize
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createclaim
        method: POST
        description: Create a new claim
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: claims-claimnumber
      path: /claims/{claimNumber}
      operations:
      - name: getclaim
        method: GET
        description: Get claim details
        inputParameters:
        - name: claimNumber
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: billing-accounts
      path: /billing/accounts
      operations:
      - name: listbillingaccounts
        method: GET
        description: List billing accounts
        inputParameters:
        - name: policyNumber
          in: query
          type: string
        - name: pageSize
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: billing-accounts-accountid-payments
      path: /billing/accounts/{accountId}/payments
      operations:
      - name: recordpayment
        method: POST
        description: Record a payment
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: quotes
      path: /quotes
      operations:
      - name: createquote
        method: POST
        description: Generate an insurance quote
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: majesco-rest
    description: REST adapter for Majesco Insurance Policy Administration API.
    resources:
    - path: /policies
      name: listpolicies
      operations:
      - method: GET
        name: listpolicies
        description: List policies
        call: majesco.listpolicies
        outputParameters:
        - type: object
          mapping: $.
    - path: /policies
      name: createpolicy
      operations:
      - method: POST
        name: createpolicy
        description: Create a new policy
        call: majesco.createpolicy
        outputParameters:
        - type: object
          mapping: $.
    - path: /policies/{policyNumber}
      name: getpolicy
      operations:
      - method: GET
        name: getpolicy
        description: Get a policy by policy number
        call: majesco.getpolicy
        with:
          policyNumber: rest.policyNumber
        outputParameters:
        - type: object
          mapping: $.
    - path: /policies/{policyNumber}
      name: updatepolicy
      operations:
      - method: PATCH
        name: updatepolicy
        description: Update (endorse) a policy
        call: majesco.updatepolicy
        with:
          policyNumber: rest.policyNumber
        outputParameters:
        - type: object
          mapping: $.
    - path: /policies/{policyNumber}/cancel
      name: cancelpolicy
      operations:
      - method: POST
        name: cancelpolicy
        description: Cancel a policy
        call: majesco.cancelpolicy
        with:
          policyNumber: rest.policyNumber
        outputParameters:
        - type: object
          mapping: $.
    - path: /policies/{policyNumber}/renew
      name: renewpolicy
      operations:
      - method: POST
        name: renewpolicy
        description: Renew a policy
        call: majesco.renewpolicy
        with:
          policyNumber: rest.policyNumber
