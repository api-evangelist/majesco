        - type: object
          mapping: $.
    - path: /claims
      name: listclaims
      operations:
      - method: GET
        name: listclaims
        description: List claims
        call: majesco.listclaims
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims
      name: createclaim
      operations:
      - method: POST
        name: createclaim
        description: Create a new claim
        call: majesco.createclaim
        outputParameters:
        - type: object
          mapping: $.
    - path: /claims/{claimNumber}
      name: getclaim
      operations:
      - method: GET
        name: getclaim
        description: Get claim details
        call: majesco.getclaim
        with:
          claimNumber: rest.claimNumber
        outputParameters:
        - type: object
          mapping: $.
    - path: /billing/accounts
      name: listbillingaccounts
      operations:
      - method: GET
        name: listbillingaccounts
        description: List billing accounts
        call: majesco.listbillingaccounts
        outputParameters:
        - type: object
          mapping: $.
    - path: /billing/accounts/{accountId}/payments
      name: recordpayment
      operations:
      - method: POST
        name: recordpayment
        description: Record a payment
        call: majesco.recordpayment
        with:
          accountId: rest.accountId
        outputParameters:
        - type: object
          mapping: $.
    - path: /quotes
      name: createquote
      operations:
      - method: POST
        name: createquote
        description: Generate an insurance quote
        call: majesco.createquote
        outputParameters:
        - type: object
          mapping: $.
