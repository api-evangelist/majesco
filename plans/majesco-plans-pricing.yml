description: >-
  Majesco publishes NO pricing and NO plans. Every public route into the product is a demo request
  or an information request handled by sales; there is no pricing page, no plan comparison, no
  self-serve tier and no developer signup anywhere on majesco.com. This file records that measured
  zero. It replaces a 2026-05-04 bulk-sweep scaffold that had invented three tiers (Free /
  Professional / Enterprise) with fabricated quotas and per-minute limits attached to the
  non-routable host api.majesco.example.com; none of those numbers came from Majesco.
