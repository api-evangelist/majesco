  expirationDate: Date!
  renewalDate: Date
  premium: Money!
  billingFrequency: BillingFrequency!
  coverages: [Coverage!]!
  endorsements: [Endorsement!]!
  claims: [Claim!]!
  insuredRisks: [InsuredRisk!]!
  billingAccount: BillingAccount
  documents: [Document!]!
