}

type ClaimPayload {
  claim: Claim
  errors: [UserError!]!
}

type BillingAccountPayload {
  billingAccount: BillingAccount
  errors: [UserError!]!
}

type InvoicePayload {
  invoice: Invoice
  errors: [UserError!]!
}

type PaymentPayload {
  payment: Payment
  errors: [UserError!]!
}

type ApplicationPayload {
  application: Application
  errors: [UserError!]!
}

type AgencyPayload {
  agency: Agency
  errors: [UserError!]!
}

type AgentPayload {
  agent: Agent
  errors: [UserError!]!
}

type EndorsementPayload {
  endorsement: Endorsement
