"""
Majesco Insurance SaaS GraphQL API Schema
Covers policy administration, billing, claims, underwriting, agency management,
product configuration, and analytics for life, annuity, P&C, and group insurance lines.
"""

schema {
  query: Query
  mutation: Mutation
}

# ---------------------------------------------------------------------------
# Root Types
# ---------------------------------------------------------------------------

type Query {
  # Policy
  policy(id: ID!): Policy
  policies(filter: PolicyFilter, page: Int, pageSize: Int): PolicyConnection

  # Claims
  claim(id: ID!): Claim
  claims(filter: ClaimFilter, page: Int, pageSize: Int): ClaimConnection

  # Billing
  billingAccount(id: ID!): BillingAccount
  billingAccounts(filter: BillingAccountFilter, page: Int, pageSize: Int): BillingAccountConnection
  invoice(id: ID!): Invoice
  invoices(accountId: ID!, page: Int, pageSize: Int): InvoiceConnection

  # Underwriting
  application(id: ID!): Application
  applications(filter: ApplicationFilter, page: Int, pageSize: Int): ApplicationConnection
  riskScore(applicationId: ID!): RiskScore

  # Agency / Distribution
  agency(id: ID!): Agency
  agencies(filter: AgencyFilter, page: Int, pageSize: Int): AgencyConnection
  agent(id: ID!): Agent
  agents(agencyId: ID!, page: Int, pageSize: Int): AgentConnection

  # Product Catalog
  product(id: ID!): InsuranceProduct
  products(filter: ProductFilter, page: Int, pageSize: Int): InsuranceProductConnection
  coverageType(id: ID!): CoverageType
  coverageTypes(lineOfBusiness: LineOfBusiness): [CoverageType!]!

  # Customer / Party
  customer(id: ID!): Customer
  customers(filter: CustomerFilter, page: Int, pageSize: Int): CustomerConnection

  # Analytics
  analyticsReport(id: ID!): AnalyticsReport
  lossRatioSummary(filter: LossRatioFilter): LossRatioSummary
  premiumSummary(filter: PremiumSummaryFilter): PremiumSummary
}

type Mutation {
  # Policy
  createPolicy(input: CreatePolicyInput!): PolicyPayload!
  updatePolicy(id: ID!, input: UpdatePolicyInput!): PolicyPayload!
  cancelPolicy(id: ID!, reason: String!): PolicyPayload!
  renewPolicy(id: ID!): PolicyPayload!
  endorsePolicy(id: ID!, input: EndorsementInput!): EndorsementPayload!

  # Claims
  submitClaim(input: SubmitClaimInput!): ClaimPayload!
  updateClaim(id: ID!, input: UpdateClaimInput!): ClaimPayload!
  assignClaim(id: ID!, adjusterId: ID!): ClaimPayload!
  settleClaim(id: ID!, input: SettleClaimInput!): ClaimPayload!
  closeClaim(id: ID!, reason: String!): ClaimPayload!

  # Billing
  createBillingAccount(input: CreateBillingAccountInput!): BillingAccountPayload!
  issueInvoice(accountId: ID!, input: IssueInvoiceInput!): InvoicePayload!
  recordPayment(input: RecordPaymentInput!): PaymentPayload!
  applyCredit(accountId: ID!, amount: Float!, note: String): BillingAccountPayload!

  # Underwriting
  submitApplication(input: SubmitApplicationInput!): ApplicationPayload!
  approveApplication(id: ID!, note: String): ApplicationPayload!
  declineApplication(id: ID!, reason: String!): ApplicationPayload!
  requestMoreInfo(id: ID!, questions: [String!]!): ApplicationPayload!

  # Agency
  createAgency(input: CreateAgencyInput!): AgencyPayload!
  updateAgency(id: ID!, input: UpdateAgencyInput!): AgencyPayload!
  createAgent(input: CreateAgentInput!): AgentPayload!
  updateAgent(id: ID!, input: UpdateAgentInput!): AgentPayload!
  assignAgentToPolicy(agentId: ID!, policyId: ID!): PolicyPayload!
}

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

scalar Date
scalar DateTime
scalar Money
scalar JSON

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enum LineOfBusiness {
  PROPERTY_AND_CASUALTY
  LIFE
  ANNUITY
  GROUP
  SPECIALTY
  HEALTH
}

enum PolicyStatus {
  DRAFT
  PENDING
  ACTIVE
  CANCELLED
  EXPIRED
  LAPSED
  REINSTATED
  SUSPENDED
}

enum ClaimStatus {
  REPORTED
  UNDER_INVESTIGATION
  PENDING_DOCUMENTATION
  IN_REVIEW
  APPROVED
  PARTIALLY_APPROVED
  DENIED
  SETTLED
  CLOSED
  REOPENED
}

enum ApplicationStatus {
  DRAFT
  SUBMITTED
  IN_REVIEW
  PENDING_INFO
  APPROVED
  DECLINED
  REFERRED
  BOUND
  WITHDRAWN
}

enum PaymentStatus {
  PENDING
  PROCESSED
  FAILED
  REVERSED
  REFUNDED
}

enum PaymentMethod {
  ACH
  CREDIT_CARD
  CHECK
  WIRE_TRANSFER
  ELECTRONIC_FUNDS_TRANSFER
}

enum BillingFrequency {
  MONTHLY
  QUARTERLY
  SEMI_ANNUAL
  ANNUAL
  SINGLE_PREMIUM
}

enum AgencyStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
  TERMINATED
}

enum AgentLicenseStatus {
  ACTIVE
  EXPIRED
  SUSPENDED
  REVOKED
}

enum CoverageCategory {
  LIABILITY
  PROPERTY
  CASUALTY
  LIFE
  HEALTH
  DISABILITY
  ANNUITY
  REINSURANCE
}

enum EndorsementType {
  ADDITION
  REMOVAL
  CHANGE
  CORRECTION
}

enum ClaimType {
  PROPERTY_DAMAGE
  BODILY_INJURY
  LIABILITY
  THEFT
  NATURAL_DISASTER
  MEDICAL
  DEATH_BENEFIT
  DISABILITY
  TOTAL_LOSS
}

# ---------------------------------------------------------------------------
