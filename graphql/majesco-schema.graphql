  errors: [UserError!]!
}

# ---------------------------------------------------------------------------
# Common Types
# ---------------------------------------------------------------------------

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
  totalPages: Int!
}

type UserError {
  field: String
  message: String!
  code: String
}

