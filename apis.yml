description: >-
  Majesco is a global provider of cloud-native insurance software for Property & Casualty and
  Life, Annuity & Health carriers, serving 130+ insurers worldwide from its Morristown, New Jersey
  headquarters. Founded in 1989, it unifies Policy, Billing and Claims administration on a single
  platform alongside digital engagement, distribution, analytics and risk & compliance products,
  with GenAI (Majesco Copilot) and agentic AI embedded across the core suites. Its ClaimVantage
  line covers L&H claims, disability and absence management. Majesco sells API Management (APIM)
  as a component of those suites rather than as a public developer program, so its API surface is
  provisioned per carrier tenant and is not publicly documented.
