x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    Majesco markets "thousands of APIs" through its APIM product but runs the gateway inside each
    carrier's own tenant, so there is no developer.majesco.com, api.majesco.com or docs.majesco.com
    (none of them resolve in DNS) and the API reference and release notes are delivered through the
    customer support portal at majescoprod.service-now.com/csm, which requires a signed-carrier
    login.
